apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: tasks
  template:
    metadata:
      labels:
        app: tasks
    spec:
      containers:
        - name: tasks
                            # kub-demo-task
          image: esjohan/kub-demo-task:latest
          env:
            - name: AUTH_ADDRESS
              # value: "10.99.104.252-"
              value: "auth-service.default"
            - name: TASKS_FOLDER
              value: tasks